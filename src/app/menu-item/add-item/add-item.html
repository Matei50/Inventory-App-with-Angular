<h1>Add Inventory Item</h1>
<form [formGroup]="addItemForm" (ngSubmit)="onSubmit()">
  <!-- <p>
    <mat-form-field apparence="outline">
      <input matInput placeholder="Item Name" type="text" formControlName="name" required />
      @if (hasError('name', 'required')) {
        <mat-error>Item Name is required</mat-error>
      }
    </mat-form- <mat-label>Item Name</mat-label>
     field>
  </p> -->

  <div class="form-div">
    <label class="form-div-text"> Item Name: </label>
    <input type="text" formControlName="name" class="form-div-input" />
  </div>

  <div class="form-div">
    <label class="form-div-text"> Description: </label>
    <textarea id="description" formControlName="description" class="form-div-input"></textarea>
  </div>

  <div class="form-div">
    <label class="form-div-text"> User: </label>
    <input type="text" formControlName="user" class="form-div-input" />
  </div>

  <div class="form-div">
    <label class="form-div-text"> Location: </label>
    <input type="text" formControlName="location" class="form-div-input" />
  </div>

  <div class="form-div">
    <label class="form-div-text"> Inventory Number: </label>
    <input type="number" formControlName="inventoryNumber" class="form-div-input" />
  </div>

  <div class="form-div">
    <label class="form-div-text"> Created At:</label>
    <input type="text" formControlName="createdAt" class="form-div-input" />
  </div>

  <div class="form-div">
    <button class="form-div-text" type="submit">Add Item</button>
  </div>
</form>

<p>Form value: {{ addItemForm.value | json }}</p>
